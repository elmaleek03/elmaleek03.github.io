---
layout: default
---

<section class="blogpage">
  <div class="blogpage__head">
    <h1 class="blogpage__title">blog</h1>

    {% if page.subtitle %}
      <p class="blogpage__subtitle">{{ page.subtitle }}</p>
    {% endif %}
  </div>

  <div class="postlist">
    {% for post in site.posts %}
      <a class="postcard" href="{{ post.url | relative_url }}">
        <div class="postcard__top">
          <h2 class="postcard__title">{{ post.title }}</h2>

          <time class="postcard__date" datetime="{{ post.date | date_to_xmlschema }}">
            {{ post.date | date: "%Y-%m-%d" }}
          </time>
        </div>

        {% if post.excerpt %}
          <p class="postcard__excerpt">
            {{ post.excerpt | strip_html | truncate: 140 }}
          </p>
        {% endif %}
      </a>
    {% endfor %}
  </div>
</section>
