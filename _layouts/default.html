<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>
      {% if page.title %}{{ page.title }} · {% endif %}visitor@elmaleeks-website:~$
    </title>

    <meta name="description" content="{{ page.description | default: site.description }}" />

    <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
  </head>

  <body>
    <div class="terminal">
      <div class="titlebar">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="titlebar__title">visitor@elmaleeks-website:~$</span>
      </div>

      <nav class="nav">
        <div class="nav__links">
          <a href="/" class="{% if page.url == '/' %}is-active{% endif %}">~/home</a>
          <a href="/blog/" class="{% if page.url contains '/blog' %}is-active{% endif %}">~/blog</a>
          <a href="/about/" class="{% if page.url == '/about/' %}is-active{% endif %}">~/about</a>
        </div>
      </nav>

      <main class="page">
        {{ content }}
      </main>

      <footer class="footer">
        <div class="footer__inner">
          <span class="footer__left">
            <span class="footer__item footer__branch">⎇ main</span>
            <span class="footer__item">UTF-8</span>
            <span class="footer__item">LF</span>
            <span class="footer__item">Ln 1, Col 1</span>
            <span class="footer__item">Spaces: 2</span>
          </span>
          <span class="footer__right">
            <span class="footer__item footer__ok">●</span>
            <span class="footer__item">Jekyll</span>
            <span class="footer__item">Markdown</span>
            <span class="footer__item">© {{ "now" | date: "%Y" }} {{ site.title }}</span>
          </span>
        </div>
      </footer>
    </div>
  </body>
</html>
